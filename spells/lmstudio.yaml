name: lmstudio
summary: Run local LLMs with a desktop GUI (LM Studio).
verify: command -v lmstudio || command -v lms
version_check: |
  software="${SOFTWARE_DIR:-$HOME/Software}"
  if compgen -G "$software/LMStudio/LM-Studio-*.AppImage" >/dev/null; then
    ls "$software/LMStudio"/LM-Studio-*.AppImage 2>/dev/null \
      | head -n 1 \
      | sed -E 's|.*/LM-Studio-([0-9.-]+)-x64\.AppImage$|\1|'
  else
    lms --version 2>/dev/null | awk '{print $NF}' | head -n 1
  fi
cast:
  default: appimage
  channels:
    appimage:
      type: shell
      summary: Pinned GUI AppImage from installers.lmstudio.ai into $SOFTWARE_DIR/LMStudio.
      run: |
        version="0.4.21-2"
        software="${SOFTWARE_DIR:-$HOME/Software}"
        target_dir="$software/LMStudio"
        url="https://installers.lmstudio.ai/linux/x64/${version}/LM-Studio-${version}-x64.AppImage"
        appimage="$target_dir/LM-Studio-${version}-x64.AppImage"
        mkdir -p "$target_dir" "$HOME/.local/bin"
        if [ -x "$appimage" ]; then
          echo "LM Studio ${version} already present, skipping download."
        else
          echo "Downloading LM Studio ${version}..."
          curl -fL -o "$appimage.part" "$url"
          mv "$appimage.part" "$appimage"
          chmod +x "$appimage"
        fi
        find "$target_dir" -maxdepth 1 -name 'LM-Studio-*.AppImage' ! -name "$(basename "$appimage")" -delete
        # Use a wrapper script instead of a direct symlink so version bumps
        # don't require regenerating it. The install dir is baked in at cast
        # time because $SOFTWARE_DIR is not set when launched from the desktop.
        # Remove first: earlier spell versions left a symlink here, and writing
        # through it would clobber (or resurrect) the AppImage it points at.
        rm -f "$HOME/.local/bin/lmstudio"
        cat > "$HOME/.local/bin/lmstudio" <<LMS_WRAPPER
        #!/bin/bash
        app_dir="$target_dir"
        app_path=\$(ls "\$app_dir"/LM-Studio-*-x64.AppImage 2>/dev/null | head -n 1)

        if [ -z "\$app_path" ]; then
            echo "Error: LM Studio AppImage not found in \$app_dir" >&2
            exit 1
        fi

        exec "\$app_path" "\$@"
        LMS_WRAPPER
        chmod +x "$HOME/.local/bin/lmstudio"
        # The `lms` CLI ships inside LM Studio: the GUI bootstraps it into
        # ~/.lmstudio/bin on first launch and appends that dir to the shell rc
        # files (https://github.com/lmstudio-ai/lms). This shim makes `lms`
        # resolvable from ~/.local/bin as well (desktop sessions, scripts that
        # don't source rc files) and explains what to do until it exists.
        rm -f "$HOME/.local/bin/lms"
        cat > "$HOME/.local/bin/lms" <<'LMS_SHIM'
        #!/bin/sh
        real_lms="$HOME/.lmstudio/bin/lms"
        if [ -x "$real_lms" ]; then
          exec "$real_lms" "$@"
        fi
        echo "lms: LM Studio CLI is not bootstrapped yet." >&2
        echo "Launch the GUI once (run: lmstudio), or run: npx lmstudio install-cli" >&2
        exit 1
        LMS_SHIM
        chmod +x "$HOME/.local/bin/lms"
      version_hint: pinned
    headless:
      type: shell
      summary: Official install.sh for the headless `lms` daemon (servers, CI, no GUI).
      run: curl -fsSL https://lmstudio.ai/install.sh | bash
      version_hint: latest
category: ai
tags: [llm, ai, local-inference, gui]
homepage: https://lmstudio.ai
provides:
  binaries: [lmstudio, lms]
desktop:
  name: LM Studio
  exec: lmstudio %U
  comment: Discover, download, and run local LLMs.
  icon: lmstudio
  categories: [Development, Science, Utility]
  startup_wm_class: LM Studio
