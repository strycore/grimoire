name: opera
summary: Opera Browser.
verify: command -v opera
version_check: opera --version 2>/dev/null
cast:
  default: dnf
  channels:
    dnf:
      type: dnf
      summary: Official Opera RPM repo + opera-stable package.
      run: |
        sudo rpm --import https://rpm.opera.com/rpmrepo.key
        sudo tee /etc/yum.repos.d/opera.repo > /dev/null <<'EOF'
        [opera]
        name=Opera packages
        type=rpm-md
        baseurl=https://rpm.opera.com/rpm
        gpgcheck=1
        gpgkey=https://rpm.opera.com/rpmrepo.key
        enabled=1
        EOF
        sudo dnf install -y opera-stable
      version_hint: latest
      requires_sudo: true
category: communication
tags: [browser]
homepage: https://www.opera.com
provides:
  binaries: [opera]
