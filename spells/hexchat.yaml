name: hexchat
summary: HexChat IRC client.
verify: command -v hexchat || flatpak info io.github.Hexchat >/dev/null 2>&1
version_check: |
  hexchat --version 2>/dev/null | grep -oE '[0-9]+(\.[0-9]+)+' | head -n 1 \
    || flatpak info io.github.Hexchat 2>/dev/null | awk '/^ *Version:/ {print $2; exit}'
cast:
  default: dnf
  channels:
    dnf:
      type: dnf
      summary: Fedora packages.
      run: sudo dnf install -y hexchat
      version_hint: distro
      requires_sudo: true
    apt:
      type: apt
      summary: Debian/Ubuntu packages.
      run: |
        sudo apt-get update
        sudo apt-get install -y hexchat
      version_hint: distro
      requires_sudo: true
    pacman:
      type: pacman
      summary: Arch extra repo.
      run: sudo pacman -S --needed --noconfirm hexchat
      version_hint: distro
      requires_sudo: true
    flatpak:
      type: flatpak
      summary: Flathub (sandboxed, auto-updates).
      run: flatpak install -y --user flathub io.github.Hexchat
      version_hint: latest
category: communication
tags: [chat, irc]
homepage: https://hexchat.github.io
provides:
  binaries: [hexchat]
