name: discord
summary: Discord chat client.
verify: flatpak info com.discordapp.Discord >/dev/null 2>&1 || command -v discord
version_check: |
  flatpak info com.discordapp.Discord 2>/dev/null | awk '/^ *Version:/ {print $2; exit}' \
    || (discord --version 2>/dev/null | awk '{print $NF}')
cast:
  default: flatpak
  channels:
    flatpak:
      type: flatpak
      summary: Flathub (recommended — sandboxed, auto-updates).
      run: flatpak install -y --user flathub com.discordapp.Discord
      version_hint: latest
    upstream:
      type: shell
      summary: Official tarball into ~/Software (no auto-update).
      run: |
        mkdir -p "$HOME/Software"
        curl -L "https://discord.com/api/download?platform=linux&format=tar.gz" \
          | tar -xz -C "$HOME/Software/"
      version_hint: pinned
category: communication
tags: [chat, voip]
homepage: https://discord.com
