name: brave
summary: Brave Browser.
verify: command -v brave-browser || command -v brave
version_check: brave-browser --version 2>/dev/null | awk '{print $NF}'
cast:
  default: dnf
  channels:
    dnf:
      type: dnf
      summary: Official Brave RPM repo + brave-browser package.
      run: |
        sudo dnf install -y dnf-plugins-core
        sudo rpm --import https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
        sudo dnf config-manager addrepo --overwrite \
          --from-repofile=https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        sudo dnf install -y brave-browser
      version_hint: latest
      requires_sudo: true
    apt:
      type: apt
      summary: Official Brave apt repo + brave-browser package.
      run: |
        sudo apt-get install -y curl
        sudo install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg \
          | sudo tee /etc/apt/keyrings/brave-browser-archive-keyring.gpg > /dev/null
        sudo chmod a+r /etc/apt/keyrings/brave-browser-archive-keyring.gpg
        echo "deb [signed-by=/etc/apt/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" \
          | sudo tee /etc/apt/sources.list.d/brave-browser-release.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y brave-browser
      version_hint: latest
      requires_sudo: true
category: communication
tags: [browser]
homepage: https://brave.com
provides:
  binaries: [brave-browser]
