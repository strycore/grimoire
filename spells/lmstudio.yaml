name: lmstudio
summary: Run local LLMs with a desktop GUI (LM Studio).
verify: command -v lmstudio || command -v lms
version_check: |
  software="${SOFTWARE_DIR:-$HOME/Software}"
  if compgen -G "$software/LMStudio/LM-Studio-*.AppImage" >/dev/null; then
    ls "$software/LMStudio"/LM-Studio-*.AppImage 2>/dev/null \
      | head -n 1 \
      | sed -E 's|.*/LM-Studio-([0-9.-]+)-x64\.AppImage$|\1|'
  else
    lms --version 2>/dev/null | awk '{print $NF}' | head -n 1
  fi
cast:
  default: appimage
  channels:
    appimage:
      type: shell
      summary: Pinned GUI AppImage from installers.lmstudio.ai into $SOFTWARE_DIR/LMStudio.
      run: |
        version="0.4.14-4"
        software="${SOFTWARE_DIR:-$HOME/Software}"
        target_dir="$software/LMStudio"
        url="https://installers.lmstudio.ai/linux/x64/${version}/LM-Studio-${version}-x64.AppImage"
        mkdir -p "$target_dir" "$HOME/.local/bin"
        rm -f "$target_dir"/LM-Studio-*.AppImage
        echo "Downloading LM Studio ${version}..."
        curl -fL -o "$target_dir/LM-Studio-${version}-x64.AppImage" "$url"
        chmod +x "$target_dir/LM-Studio-${version}-x64.AppImage"
        ln -sf "$target_dir/LM-Studio-${version}-x64.AppImage" "$HOME/.local/bin/lmstudio"
        # The GUI AppImage records its install location as an ephemeral
        # /tmp/.mount_* FUSE path, which breaks `lms server start` on a cold
        # boot ("no valid installation could be found"). Install an `lms`
        # wrapper that re-stamps the install location to the persistent
        # AppImage before delegating to the real CLI (bootstrapped into
        # ~/.lmstudio/bin on first GUI launch).
        cat > "$HOME/.local/bin/lms" <<'LMS_WRAPPER'
        #!/bin/sh
        appimage="$(readlink -f "$HOME/.local/bin/lmstudio" 2>/dev/null)"
        if [ -n "$appimage" ] && [ -x "$appimage" ] && [ -d "$HOME/.lmstudio/.internal" ]; then
          dir="$(dirname "$appimage")"
          printf '{"path":"%s","argv":["%s"],"cwd":"%s"}\n' \
            "$appimage" "$appimage" "$dir" \
            > "$HOME/.lmstudio/.internal/app-install-location.json"
        fi
        real_lms="$HOME/.lmstudio/bin/lms"
        if [ ! -x "$real_lms" ]; then
          echo "lms: LM Studio CLI is not bootstrapped yet." >&2
          echo "Launch the GUI once (run: lmstudio) to install it, then retry." >&2
          exit 1
        fi
        exec "$real_lms" "$@"
        LMS_WRAPPER
        chmod +x "$HOME/.local/bin/lms"
      version_hint: pinned
    headless:
      type: shell
      summary: Official install.sh for the headless `lms` daemon (servers, CI, no GUI).
      run: curl -fsSL https://lmstudio.ai/install.sh | bash
      version_hint: latest
category: ai
tags: [llm, ai, local-inference, gui]
homepage: https://lmstudio.ai
provides:
  binaries: [lmstudio, lms]
desktop:
  name: LM Studio
  exec: lmstudio %U
  comment: Discover, download, and run local LLMs.
  icon: lmstudio
  categories: [Development, Science, Utility]
  startup_wm_class: LM Studio
