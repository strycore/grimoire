name: fastfetch
summary: fastfetch system information tool (modern neofetch replacement).
verify: command -v fastfetch
version_check: fastfetch --version 2>/dev/null | head -n 1 | grep -oE '[0-9]+(\.[0-9]+)+' | head -n 1
cast:
  default: dnf
  channels:
    dnf:
      type: dnf
      summary: Fedora packages.
      run: sudo dnf install -y fastfetch
      version_hint: distro
      requires_sudo: true
    apt:
      type: apt
      summary: Debian/Ubuntu packages (24.04+).
      run: |
        sudo apt-get update
        sudo apt-get install -y fastfetch
      version_hint: distro
      requires_sudo: true
    pacman:
      type: pacman
      summary: Arch extra repo.
      run: sudo pacman -S --needed --noconfirm fastfetch
      version_hint: distro
      requires_sudo: true
category: system
tags: [system-info, cli, neofetch]
homepage: https://github.com/fastfetch-cli/fastfetch
provides:
  binaries: [fastfetch]
