name: google-chrome
summary: Google Chrome browser.
verify: command -v google-chrome || command -v google-chrome-stable
version_check: |
  bin=$(command -v google-chrome || command -v google-chrome-stable)
  "$bin" --version 2>/dev/null | grep -oE '[0-9]+(\.[0-9]+)+' | head -n 1
cast:
  default: dnf
  channels:
    dnf:
      type: dnf
      summary: Google's RPM (its post-install drops the repo file for updates).
      run: |
        sudo dnf install -y \
          https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
      version_hint: latest
      requires_sudo: true
    apt:
      type: apt
      summary: Google's .deb (its post-install drops the repo file for updates).
      run: |
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        curl -fL -o "$tmp/chrome.deb" \
          https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y "$tmp/chrome.deb"
      version_hint: latest
      requires_sudo: true
category: communication
tags: [browser]
homepage: https://www.google.com/chrome
provides:
  binaries: [google-chrome, google-chrome-stable]
