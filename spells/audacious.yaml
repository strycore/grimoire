name: audacious
summary: Audacious audio player.
verify: command -v audacious
version_check: audacious --version 2>/dev/null | head -n 1 | grep -oE '[0-9]+(\.[0-9]+)+' | head -n 1
cast:
  default: dnf
  channels:
    dnf:
      type: dnf
      summary: Fedora packages.
      run: sudo dnf install -y audacious audacious-plugins
      version_hint: distro
      requires_sudo: true
    apt:
      type: apt
      summary: Debian/Ubuntu packages.
      run: |
        sudo apt-get update
        sudo apt-get install -y audacious audacious-plugins
      version_hint: distro
      requires_sudo: true
    pacman:
      type: pacman
      summary: Arch extra repo.
      run: sudo pacman -S --needed --noconfirm audacious audacious-plugins
      version_hint: distro
      requires_sudo: true
category: media
tags: [audio, player, music]
homepage: https://audacious-media-player.org
provides:
  binaries: [audacious]
