name: furmark
summary: GPU stress test and benchmark from Geeks3D.
verify: test -d "${SOFTWARE_DIR:-$HOME/Software}/FurMark"
cast:
  default: tarball
  channels:
    tarball:
      type: shell
      summary: Pinned 7z archive from geeks3d.com (override $FURMARK_URL if it 404s).
      run: |
        software="${SOFTWARE_DIR:-$HOME/Software}"
        url="${FURMARK_URL:-https://www.geeks3d.com/dl/get/833}"
        mkdir -p "$software"
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        cd "$tmp"
        curl -fL -o furmark.7z "$url"
        7z x -y furmark.7z >/dev/null
        extracted=$(find . -maxdepth 1 -type d -name 'FurMark*' | head -n 1)
        if [ -z "$extracted" ]; then
          echo "FurMark archive layout was unexpected; check $tmp" >&2
          exit 1
        fi
        rm -rf "$software/FurMark"
        mv "$extracted" "$software/FurMark"
      version_hint: pinned
category: benchmark
tags: [gpu, stress-test]
homepage: https://www.geeks3d.com/furmark/
