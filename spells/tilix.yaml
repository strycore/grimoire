name: tilix
summary: Tilix tiling terminal emulator.
verify: command -v tilix
version_check: tilix --version 2>/dev/null | grep -oE '[0-9]+(\.[0-9]+)+' | head -n 1
cast:
  default: dnf
  channels:
    dnf:
      type: dnf
      summary: Fedora packages.
      run: sudo dnf install -y tilix
      version_hint: distro
      requires_sudo: true
    apt:
      type: apt
      summary: Debian/Ubuntu packages.
      run: |
        sudo apt-get update
        sudo apt-get install -y tilix
      version_hint: distro
      requires_sudo: true
    pacman:
      type: pacman
      summary: Arch extra repo.
      run: sudo pacman -S --needed --noconfirm tilix
      version_hint: distro
      requires_sudo: true
category: terminal
tags: [terminal, tiling, gtk]
homepage: https://gnunn1.github.io/tilix-web
provides:
  binaries: [tilix]
