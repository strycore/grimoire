[package]
name = "grimoire"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Declarative state for personal Linux desktops — share, version, and cast YAML spells."

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
