name: docker
summary: Docker CE container runtime.
verify: command -v docker
version_check: docker --version 2>/dev/null | awk '{gsub(",",""); print $3}'
cast:
  default: dnf
  channels:
    dnf:
      type: dnf
      summary: Docker CE official Fedora repo + docker-ce stack.
      run: |
        sudo dnf install -y dnf-plugins-core
        sudo dnf config-manager addrepo --overwrite \
          --from-repofile=https://download.docker.com/linux/fedora/docker-ce.repo
        sudo dnf install -y docker-ce docker-ce-cli containerd.io \
          docker-buildx-plugin docker-compose-plugin
        sudo systemctl enable --now docker
        sudo usermod -aG docker "$USER"
        echo "✓ Docker installed. Log out and back in for the docker group to take effect."
      version_hint: latest
      requires_sudo: true
    apt:
      type: apt
      summary: Docker CE official Debian/Ubuntu repo + docker-ce stack.
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl gnupg
        sudo install -m 0755 -d /etc/apt/keyrings
        # Use the right URL for the running distro family.
        . /etc/os-release
        case "$ID" in
          ubuntu|linuxmint|pop|elementary) docker_distro=ubuntu ;;
          debian|raspbian)                 docker_distro=debian ;;
          *) docker_distro="${ID_LIKE%% *}" ;;  # first word of ID_LIKE
        esac
        sudo curl -fsSL "https://download.docker.com/linux/${docker_distro}/gpg" \
          -o /etc/apt/keyrings/docker.asc
        sudo chmod a+r /etc/apt/keyrings/docker.asc
        codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/${docker_distro} ${codename} stable" \
          | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y docker-ce docker-ce-cli containerd.io \
          docker-buildx-plugin docker-compose-plugin
        sudo systemctl enable --now docker
        sudo usermod -aG docker "$USER"
        echo "✓ Docker installed. Log out and back in for the docker group to take effect."
      version_hint: latest
      requires_sudo: true
    pacman:
      type: pacman
      summary: Arch extra repo.
      run: |
        sudo pacman -S --needed --noconfirm docker docker-buildx docker-compose
        sudo systemctl enable --now docker
        sudo usermod -aG docker "$USER"
        echo "✓ Docker installed. Log out and back in for the docker group to take effect."
      version_hint: distro
      requires_sudo: true
category: development
tags: [containers, runtime]
homepage: https://docs.docker.com
provides:
  binaries: [docker]
