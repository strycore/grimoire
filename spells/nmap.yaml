name: nmap
summary: Nmap network scanner.
verify: command -v nmap
version_check: nmap --version 2>/dev/null | head -n 1 | grep -oE '[0-9]+(\.[0-9]+)+' | head -n 1
cast:
  default: dnf
  channels:
    dnf:
      type: dnf
      summary: Fedora packages.
      run: sudo dnf install -y nmap
      version_hint: distro
      requires_sudo: true
    apt:
      type: apt
      summary: Debian/Ubuntu packages.
      run: |
        sudo apt-get update
        sudo apt-get install -y nmap
      version_hint: distro
      requires_sudo: true
    pacman:
      type: pacman
      summary: Arch extra repo.
      run: sudo pacman -S --needed --noconfirm nmap
      version_hint: distro
      requires_sudo: true
category: networking
tags: [security, scanner, cli]
homepage: https://nmap.org
provides:
  binaries: [nmap]
