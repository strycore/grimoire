name: claude-code-history-viewer
summary: Desktop app to explore, search and analyze your local Claude Code conversation history.
verify: command -v claude-code-history-viewer
# Read the version off the AppImage file name: this is a GUI app, so calling
# the binary with --version would just open a window.
version_check: |
  software="${SOFTWARE_DIR:-$HOME/Software}"
  ls "$software/ClaudeCodeHistoryViewer"/Claude.Code.History.Viewer_*.AppImage 2>/dev/null \
    | head -n 1 \
    | sed -E 's|.*/Claude\.Code\.History\.Viewer_([0-9.]+)_.*\.AppImage$|\1|'
cast:
  default: appimage
  channels:
    appimage:
      type: shell
      summary: Latest AppImage from GitHub releases into $SOFTWARE_DIR/ClaudeCodeHistoryViewer (x86_64 only).
      run: |
        software="${SOFTWARE_DIR:-$HOME/Software}"
        target_dir="$software/ClaudeCodeHistoryViewer"
        mkdir -p "$target_dir" "$HOME/.local/bin"
        url=$(curl -s https://api.github.com/repos/jhlee0409/claude-code-history-viewer/releases/latest \
              | grep -oE '"browser_download_url": "[^"]+_amd64\.AppImage"' \
              | head -n 1 \
              | sed -E 's/.*"(http[^"]+)"$/\1/')
        if [ -z "$url" ]; then
          echo "Couldn't find a Claude Code History Viewer AppImage URL on GitHub releases" >&2
          exit 1
        fi
        appimage="$target_dir/$(basename "$url")"
        curl -fL -o "$appimage.part" "$url"
        rm -f "$target_dir"/*.AppImage
        mv "$appimage.part" "$appimage"
        chmod +x "$appimage"
        ln -sf "$appimage" "$HOME/.local/bin/claude-code-history-viewer"
      version_hint: latest
category: development
tags: [ai, claude-code, sessions, history, gui]
homepage: https://jhlee0409.github.io/claude-code-history-viewer/
system_requires: [curl]
provides:
  binaries: [claude-code-history-viewer]
desktop:
  name: Claude Code History Viewer
  exec: claude-code-history-viewer %U
  comment: Explore, search and analyze your Claude Code conversation history.
  icon: claude-code-history-viewer
  categories: [Development, Utility]
