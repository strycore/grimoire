name: Release

# Push a tag like `v0.1.0` and this builds a Linux x86_64 release artifact,
# then publishes a GitHub release with auto-generated notes and the artifact
# attached. To release:
#   git tag v0.1.0 && git push --tags
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: grimoire

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Strip
        run: strip target/release/${{ env.BIN_NAME }}

      - name: Package
        id: pkg
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="$(mktemp -d)"
          cp target/release/${{ env.BIN_NAME }} "$stage/"
          cp README.md SPEC.md LICENSE "$stage/"
          archive="${{ env.BIN_NAME }}-${version}-linux-x86_64.tar.gz"
          tar -C "$stage" -czf "$archive" .
          sha256sum "$archive" > "${archive}.sha256"
          {
            echo "archive=$archive"
            echo "sha=${archive}.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.sha }}
